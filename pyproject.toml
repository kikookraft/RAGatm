[project]
name = "ragatm"
version = "0.1.0"
description = "Retrieval Augmented Genertation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flake8>=7.3.0",
    "fire>=0.7.0",
    "mypy>=2.3.0",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "bm25s>=0.3.10",
    "types-tqdm>=4.70.0.20260805",
    "pystemmer>=3.1.0",
]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true

# bm 25s and Stemmer ship no type information 
[[tool.mypy.overrides]]
module = ["bm25s", "Stemmer"]
ignore_missing_imports = true
